<h3>1. What this is</h3>
<p>PC Power is a free app for Windows and Android, published by Mogamat Muneer Miller, Cape Town, South Africa (&quot;we&quot;, &quot;us&quot;). It lets you schedule when a computer turns off or on, and control that from your phone.</p>
<p>These terms are the agreement between you and us for using PC Power. By installing or using it you agree to them. If you do not agree, do not use the app.</p>
<p>If you use PC Power for a business, school or other organisation, you confirm that you are allowed to accept these terms for it.</p>
<h3>2. What you may do</h3>
<p>You may install and use PC Power, free of charge, on computers and phones that you own or are authorised to manage.</p>
<p>You may not use PC Power to control, turn on, turn off or access a computer without the permission of its owner. Doing so may be a crime, including under South Africa&#x27;s Cybercrimes Act.</p>
<p>You may not use the app to break any law, to harm anyone, or to interfere with networks or devices that are not yours.</p>
<h3>3. Important: what can go wrong</h3>
<p><b>PC Power turns computers off and on. Please read this section carefully, because it describes risks that you accept by using the app.</b></p>
<p><b>Unsaved work can be lost. When a computer shuts down, restarts, sleeps or hibernates, whether at once or on a schedule, anything not saved in open programs may be lost, and running tasks such as downloads, backups, updates or recordings may be interrupted. You are responsible for saving work and for choosing safe times.</b></p>
<p><b>It may not always work. Turning a computer on remotely depends on your computer&#x27;s hardware and settings, your router, your network and your internet provider. A schedule may be missed if the computer is off, the app is not running, or Windows prevents it. Do not rely on PC Power where a failure could cause injury, damage or serious loss.</b></p>
<p><b>Your network setup is your responsibility. If you choose to open ports on your router, switch off &quot;Only accept phones on my own network&quot;, or use the app over the internet, you do so at your own risk. We describe how to do this as safely as we can, but we cannot see or control your network.</b></p>
<p><b>Changing computer settings is at your own risk. The app and its instructions may suggest changes to Windows, network card and BIOS settings. Changing such settings can affect how your computer behaves.</b></p>
<h3>4. No warranty</h3>
<p><b>PC Power is provided free of charge, &quot;as is&quot; and &quot;as available&quot;. To the fullest extent the law allows, we give no warranties or guarantees of any kind, including that the app will be uninterrupted, error-free, secure, or suitable for a particular purpose.</b></p>
<h3>5. Limit of our liability</h3>
<p><b>To the fullest extent the law allows, we are not liable for any loss or damage arising from your use of, or inability to use, PC Power. This includes loss of data or unsaved work, loss of profit or business, damage to hardware or software, the cost of electricity, and any indirect or consequential loss.</b></p>
<p><b>If we are found liable despite this section, our total liability to you is limited to R100 (one hundred South African rand).</b></p>
<p>Nothing in these terms limits or excludes liability that cannot legally be limited or excluded where you live. In particular, nothing here excludes liability for death or personal injury caused by our negligence, for loss caused by our gross negligence, wilful misconduct or fraud, or takes away rights you have under the South African Consumer Protection Act 68 of 2008 or under the consumer protection law of the country you live in. Section 12 says more about specific countries.</p>
<h3>6. Your responsibility to us</h3>
<p><b>If someone makes a claim against us because you used PC Power unlawfully or in breach of these terms, for example by controlling a computer without permission, you agree to cover the reasonable costs and losses we suffer as a result, to the extent the law allows.</b></p>
<h3>7. Security</h3>
<p>We have designed PC Power to protect the connection between your phone and your computer, but no software is perfectly secure. Keep the pairing code private, pair only your own phones, remove phones you no longer use, and keep the app up to date.</p>
<p>If you find a security problem in PC Power, please tell us at muneermilleror@gmail.com so we can fix it.</p>
<p>The signal that turns a computer on (Wake-on-LAN) has no password. That is how the standard works. Anyone already on your network can turn a computer on, although they cannot turn it off or see what is on it through PC Power.</p>
<h3>8. Privacy</h3>
<p>Our Privacy Policy explains what information the app uses. In short: PC Power has no accounts, no adverts and no tracking, and we do not receive any information from it.</p>
<h3>9. Ownership and other people&#x27;s software</h3>
<p>PC Power and its name, design and code belong to Mogamat Muneer Miller. These terms give you permission to use the app; they do not transfer ownership.</p>
<p>PC Power includes open-source software written by other people, used under their licences. You can read those licences in the app under Legal.</p>
<p>&quot;Windows&quot; is a trademark of Microsoft, and &quot;Android&quot; and &quot;Google Play&quot; are trademarks of Google. PC Power is not connected with or endorsed by them.</p>
<h3>10. App stores</h3>
<p>If you got PC Power from an app store, the store&#x27;s own terms also apply. The store is not a party to these terms and is not responsible for the app or for supporting it.</p>
<h3>11. Changes and ending</h3>
<p>We may update the app and these terms. If the terms change in an important way, the app will ask you to agree again. We may stop offering or supporting PC Power at any time.</p>
<p>You can stop using PC Power at any time by uninstalling it. Your permission to use it ends if you break these terms.</p>
<h3>12. If you live outside South Africa</h3>
<p>PC Power is offered in many countries. Wherever you live, you keep every consumer right that the law of your country says a contract cannot take away. If that law gives you more protection than these terms, the law applies and these terms are read to fit it.</p>
<p>European Economic Area, United Kingdom and Switzerland: if you are a consumer, the mandatory consumer protection law of the country you live in applies to you, and you may bring a claim in the courts of that country. We remain fully liable for damage we cause intentionally or through gross negligence, and for death or personal injury caused by our negligence. The R100 limit in section 5 and the other limits in sections 4 to 6 apply to you only as far as your local law allows.</p>
<p>Australia: nothing in these terms excludes, restricts or modifies the consumer guarantees or any other right you have under the Australian Consumer Law. Where that law lets us limit our liability for failing to meet a consumer guarantee, our liability is limited to supplying the app again.</p>
<p>New Zealand: nothing in these terms limits your rights under the Consumer Guarantees Act 1993 where you use the app as a consumer.</p>
<p>United States and Canada: some states and provinces do not allow certain warranties to be excluded or certain kinds of damages to be limited, so parts of sections 4 and 5 may not apply to you. You may also have rights that vary from place to place. In Quebec, nothing in these terms takes away rights you have under the Consumer Protection Act.</p>
<p>Other countries: the same principle applies. These terms limit our liability only as far as your local law permits.</p>
<p>Age: you must be old enough to enter into a binding agreement where you live, or have the permission of a parent or guardian who accepts these terms for you.</p>
<p>Trade restrictions: you may not use or pass on PC Power where that is prohibited by the export control or sanctions laws that apply to you. The app uses standard encryption.</p>
<p>Language: these terms are written in English. If we provide a translation and it differs from the English version, the English version applies, unless the law where you live says otherwise.</p>
<h3>13. Law and disputes</h3>
<p>These terms are governed by the law of South Africa. This choice of law does not take away any protection that the law of the country you live in gives you as a consumer and that cannot be excluded by agreement.</p>
<p>The courts of South Africa may hear disputes about these terms. If you are a consumer, you may instead bring a claim in the courts of the country you live in, and we will not bring a claim against you anywhere else.</p>
<p>If you have a complaint, please contact us first at muneermilleror@gmail.com so we can try to resolve it. South African consumers may also approach the National Consumer Commission.</p>
<p>If part of these terms is found to be invalid, the rest still applies.</p>
<h3>14. Contact</h3>
<p>Mogamat Muneer Miller, Cape Town, South Africa. Email: muneermilleror@gmail.com</p>

<template id="tplPrivacy"><p class="hint">Effective 22 November 2026</p>
<h3>Summary</h3>
<p>PC Power does not collect, receive or sell any information about you. It has no accounts, no adverts, no analytics and no tracking. Everything it needs stays on your own phone and computer.</p>
<h3>1. Who we are</h3>
<p>PC Power is published by Mogamat Muneer Miller, Cape Town, South Africa. For the purposes of South Africa&#x27;s Protection of Personal Information Act (POPIA), we are the responsible party for the app, although we do not receive any personal information through it. Contact: muneermilleror@gmail.com</p>
<h3>2. Information we collect</h3>
<p>None. PC Power does not send any information to us or to anyone else. We have no server that the app talks to, and we cannot see your devices, your schedules or how you use the app.</p>
<h3>3. Information kept on your own devices</h3>
<p>To work, PC Power keeps some technical details on your devices. They never leave your devices except when your phone and your computer talk directly to each other.</p>
<p>On your phone: the names of the computers you paired; their network addresses (IP address, hardware &quot;MAC&quot; address and, if you enter one, your public address or DDNS name); a fingerprint of each computer&#x27;s security certificate; and an access key for each computer, kept in your phone&#x27;s encrypted storage. These are excluded from Android backups. So that the home-screen widget and quick settings tile can turn a computer on, the app keeps a copy of that one computer&#x27;s name and addresses where the widget can read it; the access key is never included.</p>
<p>On your computer: the computer&#x27;s name; the pairing code; your schedules; the name and pairing date of each paired phone, with a scrambled (hashed) copy of its access key; the security certificate the app created; and a log file listing recent actions and the network addresses they came from. The log is replaced each time the app starts.</p>
<p>The computer also keeps a short activity list (the last 100 entries, such as &quot;Shut down, from Sam&#x27;s phone&quot; or &quot;Scheduled sleep postponed&quot;), your timer, your automatic rules and your days off. Paired phones can read the activity list.</p>
<p>Groups of computers and your app lock setting are kept on your phone only. If you turn on the app lock, Android checks your fingerprint, face or screen lock and only tells PC Power whether it matched; PC Power never receives or stores biometric data.</p>
<p>Problem reports: if you choose to make one, the app shows you a report about how PC Power is set up (versions, the computer&#x27;s local network address and type, wake settings, recent activity and log lines). It contains no access keys, pairing codes or public addresses. It is only sent if you send it yourself, by email from your own email app, to the developer, who uses it only to help you and deletes it when your question is resolved.</p>
<p>To avoid turning the computer off while it is being used, the Windows app checks how long ago the keyboard or mouse was last used, whether a full-screen app is open, which programs have asked Windows to stay awake, and how busy the network connection is. It does not look at what you type, what is on your screen or what is being transferred. These checks are used in the moment and are not recorded, except that the reason a schedule was postponed (which can include the name of a program) appears in the activity list.</p>
<h3>4. How the apps communicate</h3>
<p>Your phone and computer talk directly to each other over your own network, using an encrypted connection. If you set up access from outside your home, they talk directly over the internet in the same encrypted way.</p>
<p>To find computers and to turn them on, the phone sends small signals on your local network. The turn-on signal contains the computer&#x27;s hardware address and is not encrypted; that is how the Wake-on-LAN standard works. If you have paired more than one computer, the phone may ask a computer that is on to send that signal for another one; to do so it sends that computer the other one&#x27;s name and hardware address over the encrypted connection.</p>
<p>Your internet provider and network equipment can see that devices are communicating, as with any app, but not what is said over the encrypted connection.</p>
<h3>5. Permissions</h3>
<p>The Android app asks only for network access, which it needs to reach your computers. It does not ask for your location, contacts, camera, microphone, files or any other personal data.</p>
<p>The Windows app listens on your network so that paired phones can reach it. With your approval, it can change the Windows power and network-card settings described in the app. If you choose to install it, it adds a background service that starts with Windows, a firewall rule for private networks and a Start menu shortcut, all removed again when you uninstall.</p>
<h3>6. Sharing</h3>
<p>We do not share your information with anyone, because we do not have it. PC Power contains no third-party advertising or analytics software.</p>
<h3>7. Keeping and deleting information</h3>
<p>The information stays on your devices for as long as you keep the app. To delete it: remove a computer in the phone app, remove a phone in the PC Power window, or uninstall the app. On Windows, if you installed PC Power, uninstall it from Settings, Apps, Installed apps: that removes the program, its background service, its firewall rule and all of its settings. If you only ran the portable copy, quit it and delete the program and the folder named PCPower in your user profile&#x27;s AppData\Roaming folder.</p>
<h3>8. Security</h3>
<p>The connection between phone and computer is encrypted, each phone has its own access key that you can remove, and pairing a new phone only works on your own network. No system is perfectly secure; see the Terms of Use for the precautions we ask you to take.</p>
<h3>9. Children</h3>
<p>PC Power is a general utility and is not aimed at children. It does not knowingly collect information from anyone, including children.</p>
<h3>10. Your rights</h3>
<p>Privacy laws such as POPIA in South Africa and the GDPR in Europe give you rights over personal information that organisations hold about you, including to see it, correct it or have it deleted. Because we hold no information about you, there is nothing for us to provide or delete, but you are welcome to contact us with any question.</p>
<p>If you believe your privacy rights have been infringed, South African residents may complain to the Information Regulator (inforegulator.org.za). People elsewhere may contact their local data protection authority.</p>
<h3>11. Information for specific regions</h3>
<p>European Economic Area, United Kingdom and Switzerland: under the GDPR and UK GDPR we would be the &quot;controller&quot; of any personal data we handled, but we handle none: the app does not send us or anyone else personal data. Nothing is transferred to another country by us, and we carry out no profiling or automated decision-making. You have the rights described in section 10 and may complain to the data protection authority in your country.</p>
<p>United States, including California: we do not collect, sell or share personal information as those terms are used in the California Consumer Privacy Act and similar state laws, and we do not use it for advertising. PC Power is not directed at children under 13 and collects no information from them.</p>
<p>Brazil, Canada, Australia, New Zealand and other countries with privacy laws: the same is true everywhere. We do not collect or receive your personal information, so we do not store it, disclose it or move it across borders.</p>
<h3>12. Changes to this policy</h3>
<p>If PC Power changes in a way that affects your privacy, for example if an optional online service is added in future, we will update this policy first and the app will ask you to agree again before that feature is used.</p>
<h3>13. Contact</h3>
<p>Mogamat Muneer Miller, Cape Town, South Africa. Email: muneermilleror@gmail.com</p>
